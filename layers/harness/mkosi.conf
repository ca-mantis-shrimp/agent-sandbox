# The agent harnesses as an extension layer (agent@.service's layers/harness)
# over an Arch base tree with nodejs and npm, given with --base-tree. The output
# holds only what this layer adds. mkosi 27 mounts base trees before entering
# its user namespace, so build unprivileged as `unshare -rm mkosi --base-tree=...`.
[Distribution]
Distribution=arch

[Output]
Format=directory
Output=harness
Overlay=yes

[Build]
WithNetwork=yes

[Content]
Bootable=no
