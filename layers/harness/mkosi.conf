# The agent harnesses as an extension layer (agent@.service's layers/harness.raw and
# harness-etc.raw). Build it with `agent-layer harness harness layers/harness`, which
# supplies the base tree, output name and release files and rebuilds only when stale.
# It holds only what this layer adds.
[Distribution]
Distribution=arch

[Output]
Format=directory
Overlay=yes

[Build]
WithNetwork=yes
ToolsTree=default

[Content]
Bootable=no
