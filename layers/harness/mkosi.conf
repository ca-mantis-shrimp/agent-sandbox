# The agent harnesses as an extension image (agent@.service's layers/harness.raw)
# over an Arch base tree with nodejs and npm, given with --base-tree. It holds
# only what this layer adds; mkosi names its extension-release after Output=.
# mkosi 27 mounts base trees before entering its user namespace, so build
# unprivileged as `unshare -rm mkosi --base-tree=...`.
[Distribution]
Distribution=arch

[Output]
Format=sysext
Output=harness
Overlay=yes

[Build]
WithNetwork=yes
ToolsTree=default

[Content]
Bootable=no
